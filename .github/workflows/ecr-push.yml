name: Build and Deploy to ECR/EC2 (dev)

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ecr-push.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_IAM_ROLE_ARN: ${{ secrets.AWS_IAM_ROLE_ARN }}

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ECR_REPO_BACKEND }}:latest
            ${{ secrets.ECR_REPO_BACKEND }}:${{ github.sha }}

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # 프로덕션: 빈 문자열 → 상대 경로 사용 → Nginx 프록시로 Backend 연결
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ secrets.ECR_REPO_FRONTEND }}:latest
            ${{ secrets.ECR_REPO_FRONTEND }}:${{ github.sha }}

  deploy-dev:
    needs: [backend-image, frontend-image]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: EC2로 배포 (SSH + Docker Compose)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            # 작업 디렉토리 이동
            cd ~/self-app

            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin \
              733002311297.dkr.ecr.ap-northeast-2.amazonaws.com

            # 기존 컨테이너 정지 (docker-compose 관리)
            docker compose -f docker-compose.prod.yml down

            # 최신 이미지 Pull
            docker compose -f docker-compose.prod.yml pull

            # 컨테이너 시작 (DB, Redis, Backend, Frontend 모두)
            docker compose -f docker-compose.prod.yml up -d

            # 사용하지 않는 이미지 정리
            docker image prune -f

            # 상태 확인
            echo "=== 컨테이너 상태 ==="
            docker compose -f docker-compose.prod.yml ps
