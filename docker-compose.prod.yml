# 프로덕션용 Docker Compose (AWS EC2)
# ECR 이미지 사용
#
# 사용법:
#   1. .env 파일 생성 (아래 env_file 참조)
#   2. docker compose -f docker-compose.prod.yml up -d

services:
  backend:
    image: ${ECR_REPO_BACKEND:-733002311297.dkr.ecr.ap-northeast-2.amazonaws.com/self-backend}:${IMAGE_TAG:-latest}
    container_name: self-backend
    env_file:
      - .env
    environment:
      # Docker 네트워크 내부 설정 (고정)
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ML_API_URL: http://pred:8001
    # EC2 IAM 역할 사용을 위한 메타데이터 서비스 접근 설정
    # EC2 메타데이터 서비스(169.254.169.254)에 접근할 수 있도록 호스트 IP 매핑
    extra_hosts:
      - "metadata:169.254.169.254"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # pred 의존성 제거: 순환 의존성 방지 (pred가 backend 마이그레이션 완료 대기)
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py shell -c \"from django.contrib.sites.models import Site; Site.objects.update_or_create(id=1, defaults={'domain': '${EC2_PUBLIC_IP:-localhost}', 'name': 'SelF Production'})\" &&
             gunicorn project_self.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    image: ${ECR_REPO_FRONTEND:-733002311297.dkr.ecr.ap-northeast-2.amazonaws.com/self-frontend}:${IMAGE_TAG:-latest}
    container_name: self-frontend
    depends_on:
      - backend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro # SSL 인증서 마운트
    ports:
      - "80:80"
      - "443:443" # HTTPS 포트 추가
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  pred:
    image: ${ECR_REPO_PRED:-733002311297.dkr.ecr.ap-northeast-2.amazonaws.com/self-pred}:${IMAGE_TAG:-latest}
    container_name: self-pred
    env_file:
      - .env
    environment:
      # DB 설정 (backend와 동일한 PostgreSQL 사용)
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-selfdb}
      DB_USER: ${DB_USER:-selfuser}
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis 설정
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
    # EC2 IAM 역할 사용을 위한 메타데이터 서비스 접근 설정
    extra_hosts:
      - "metadata:169.254.169.254"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - ./pred/models:/app/models
    # 마이그레이션 완료 대기 후 서버 시작 (products 테이블 = Django 커스텀 테이블명)
    command: >
      sh -c "echo '[PRED] Backend 마이그레이션 대기 중...' &&
             while ! PGPASSWORD=${DB_PASSWORD} psql -h db -U ${DB_USER:-selfuser} -d ${DB_NAME:-selfdb} -c 'SELECT 1 FROM products LIMIT 1;' >/dev/null 2>&1; do
               sleep 3;
             done &&
             echo '[PRED] 테이블 확인 완료, 서버 시작' &&
             uvicorn main:app --host 0.0.0.0 --port 8001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: self-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-selfdb}
      POSTGRES_USER: ${DB_USER:-selfuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-selfuser} -d ${DB_NAME:-selfdb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: self-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Celery Worker: GMS 재료 추출 비동기 태스크 처리
  celery-worker:
    image: ${ECR_REPO_BACKEND:-733002311297.dkr.ecr.ap-northeast-2.amazonaws.com/self-backend}:${IMAGE_TAG:-latest}
    container_name: self-celery-worker
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-selfdb}
      DB_USER: ${DB_USER:-selfuser}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      ML_API_URL: http://pred:8001
      CELERY_CONCURRENCY: "${CELERY_CONCURRENCY:-4}"
    extra_hosts:
      - "metadata:169.254.169.254"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A project_self worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-4}
      -Q high_priority,default,low_priority
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Celery Beat: 스케줄러 (매시 정각 미처리 상품 추출, 매일 새벽 재처리)
  celery-beat:
    image: ${ECR_REPO_BACKEND:-733002311297.dkr.ecr.ap-northeast-2.amazonaws.com/self-backend}:${IMAGE_TAG:-latest}
    container_name: self-celery-beat
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-selfdb}
      DB_USER: ${DB_USER:-selfuser}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A project_self beat
      --loglevel=info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  postgres_data:
