services:
  backend:
    build: ./backend
    container_name: self-backend
    env_file:
      - backend/.env
    environment:
      # docker-compose 내부 네트워크용 DB 설정 (env 파일 값 오버라이드)
      # settings.py가 읽는 개별 환경변수로 설정
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: selfdb
      DB_USER: selfuser
      DB_PASSWORD: selfpass
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ML_API_URL: http://pred:8001
    volumes:
      # data 폴더 마운트 (JSON 파이프라인 및 파일 접근)
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pred:
        condition: service_started
    ports:
      - "8000:8000"
    # 컨테이너 시작 시 migrate + Site 설정 + CSV 임포트 + gunicorn 실행
    # 주의: JSON 파이프라인 실패 시 gunicorn 실행을 막기 위해 || 처리
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py shell -c \"from django.contrib.sites.models import Site; Site.objects.update_or_create(id=1, defaults={'domain': 'localhost:8000', 'name': 'SelF Local'})\" &&
             (python manage.py process_json_data --show-details 2>/dev/null || echo '[INIT] JSON 임포트 스킵') &&
             gunicorn project_self.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    container_name: self-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      # 로컬 개발용 Nginx 설정(HTTP, SSL 미사용)
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

  pred:
    build: ./pred
    container_name: self-pred
    env_file:
      - backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: self-postgres
    environment:
      POSTGRES_DB: selfdb
      POSTGRES_USER: selfuser
      POSTGRES_PASSWORD: selfpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfuser -d selfdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: self-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Celery Worker: GMS 재료 추출 비동기 태스크 처리
  celery-worker:
    build: ./backend
    container_name: self-celery-worker
    env_file:
      - backend/.env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: selfdb
      DB_USER: selfuser
      DB_PASSWORD: selfpass
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ML_API_URL: http://pred:8001
      CELERY_CONCURRENCY: "4"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A project_self worker
      --loglevel=info
      --concurrency=4
      -Q high_priority,default,low_priority
    restart: unless-stopped

  # Celery Beat: 스케줄러 (매시 정각 미처리 상품 추출, 매일 새벽 재처리)
  celery-beat:
    build: ./backend
    container_name: self-celery-beat
    env_file:
      - backend/.env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: selfdb
      DB_USER: selfuser
      DB_PASSWORD: selfpass
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A project_self beat
      --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
