services:
  backend:
    build: ./backend
    container_name: self-backend
    env_file:
      - backend/.env
    environment:
      # docker-compose 내부 네트워크용 DB 설정 (env 파일 값 오버라이드)
      # settings.py가 읽는 개별 환경변수로 설정
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: selfdb
      DB_USER: selfuser
      DB_PASSWORD: selfpass
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ML_API_URL: http://pred:8001
    volumes:
      # data 폴더 마운트 (JSON 파이프라인 및 파일 접근)
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # pred 의존성 제거: 순환 의존성 방지 (pred가 backend 마이그레이션 완료 대기)
    ports:
      - "8000:8000"
    # 컨테이너 시작 시 migrate + Site 설정 + CSV 임포트 + gunicorn 실행
    # 주의: JSON 파이프라인 실패 시 gunicorn 실행을 막기 위해 || 처리
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py shell -c \"from django.contrib.sites.models import Site; Site.objects.update_or_create(id=1, defaults={'domain': 'localhost:8000', 'name': 'SelF Local'})\" &&
             (python manage.py process_json_data --show-details 2>/dev/null || echo '[INIT] JSON 임포트 스킵') &&
             gunicorn project_self.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    container_name: self-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      # 로컬 개발용 Nginx 설정(HTTP, SSL 미사용)
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

  pred:
    build: ./pred
    container_name: self-pred
    env_file:
      - backend/.env
    environment:
      # DB 설정 (backend와 동일한 PostgreSQL 사용)
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: selfdb
      DB_USER: selfuser
      DB_PASSWORD: selfpass
      # Redis 설정
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      # 런타임 모델만 마운트 (연속 학습으로 지속 변경됨)
      - ./pred/models/runtime:/app/models/runtime
      # 백업 디렉토리도 마운트 (컨테이너 재시작 후에도 백업 유지)
      - ./pred/models/backups:/app/models/backups
    restart: unless-stopped
    # 마이그레이션 완료 대기 후 서버 시작 (products 테이블 = Django 커스텀 테이블명)
    command: >
      sh -c "echo '[PRED] Backend 마이그레이션 대기 중...' &&
             while ! PGPASSWORD=selfpass psql -h db -U selfuser -d selfdb -c 'SELECT 1 FROM products LIMIT 1;' >/dev/null 2>&1; do
               sleep 3;
             done &&
             echo '[PRED] 테이블 확인 완료, 서버 시작' &&
             uvicorn main:app --host 0.0.0.0 --port 8001"

  db:
    image: postgres:16-alpine
    container_name: self-postgres
    environment:
      POSTGRES_DB: selfdb
      POSTGRES_USER: selfuser
      POSTGRES_PASSWORD: selfpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfuser -d selfdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: self-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Celery Worker: GMS 재료 추출 비동기 태스크 처리
  celery-worker:
    build: ./backend
    container_name: self-celery-worker
    env_file:
      - backend/.env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: selfdb
      DB_USER: selfuser
      DB_PASSWORD: selfpass
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ML_API_URL: http://pred:8001
      CELERY_CONCURRENCY: "4"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A project_self worker
      --loglevel=info
      --concurrency=4
      -Q high_priority,default,low_priority
    restart: unless-stopped

  # Celery Beat: 스케줄러 (매시 정각 미처리 상품 추출, 매일 새벽 재처리)
  celery-beat:
    build: ./backend
    container_name: self-celery-beat
    env_file:
      - backend/.env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: selfdb
      DB_USER: selfuser
      DB_PASSWORD: selfpass
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A project_self beat
      --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
